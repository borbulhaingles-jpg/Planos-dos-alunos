<style>

    --yellow-text: #854F0B;
    --bg: #F4F6FB;
    --card: #FFFFFF;
    --text: #1E1E2D;
    --muted: #8F90A6;
    --border: #E8E9F0;
    --shadow: 0 2px 16px rgba(26,107,74,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .top-bar {
    background: var(--primary);
    padding: 24px 28px;
    color: #fff;
    display: flex; align-items: center; gap: 16px;
  }
  .top-logo { font-size: 1.5rem; }
  .top-bar h1 { font-size: 1.2rem; font-weight: 700; }
  .top-bar p  { font-size: 0.8rem; opacity: 0.8; margin-top: 3px; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .top-count { background: rgba(255,255,255,0.18); font-size: 0.78rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; white-space: nowrap; }
  .btn-nova {
    background: #fff; color: var(--primary);
    font-size: 0.82rem; font-weight: 700;
    padding: 8px 16px; border-radius: 20px;
    border: none; cursor: pointer; white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn-nova:hover { opacity: 0.88; }

  .content { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }

  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 10px 16px;
    margin-bottom: 28px; box-shadow: var(--shadow);
  }
  .search-bar input { border: none; outline: none; font-size: 0.9rem; flex: 1; background: transparent; color: var(--text); }
  .search-bar input::placeholder { color: var(--muted); }

  .section-title {
    font-size: 0.75rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }

  .aluna-card {
    background: var(--card); border-radius: 14px; border: 1.5px solid var(--border);
    padding: 18px; text-decoration: none; color: var(--text);
    display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
    box-shadow: var(--shadow);
  }
  .aluna-card:hover { border-color: var(--primary); box-shadow: 0 4px 20px rgba(26,107,74,0.15); transform: translateY(-2px); }

  .card-top { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; flex-shrink: 0; color: #fff; }
  .card-name { font-size: 0.95rem; font-weight: 700; }
  .card-nivel { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 0.68rem; font-weight: 600; padding: 3px 9px; border-radius: 10px; }
  .tag-y { background: var(--yellow-light); color: var(--yellow-text); }
  .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); }
  .card-since { font-size: 0.72rem; color: var(--muted); }
  .arrow { color: var(--primary); font-size: 1rem; font-weight: 600; }
  .empty-search { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: 0.72rem; margin-top: 40px; }

  /* ── MODAL ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 100;
    align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 18px;
    padding: 28px; width: 100%; max-width: 460px; margin: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }
  .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 10px 14px; border-radius: 10px;
    border: 1.5px solid var(--border); font-size: 0.9rem;
    color: var(--text); background: var(--bg); outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus { border-color: var(--primary); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .color-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .color-opt { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.15s; }
  .color-opt:hover { transform: scale(1.15); }
  .color-opt.selected { border-color: var(--text); }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn-cancel { flex: 1; padding: 11px; border-radius: 10px; border: 1.5px solid var(--border); background: transparent; font-size: 0.9rem; cursor: pointer; color: var(--muted); }
  .btn-gerar { flex: 2; padding: 11px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
  .btn-gerar:hover { opacity: 0.88; }

  /* ── SUCESSO ── */
  .success-box { display: none; background: #E6FAF4; border: 1.5px solid #43C59E; border-radius: 12px; padding: 16px 18px; margin-top: 18px; }
  .success-box.show { display: block; }
  .success-box p { font-size: 0.85rem; color: #0F6E56; line-height: 1.6; margin-bottom: 8px; }
  .success-box code { background: #fff; border-radius: 6px; padding: 2px 6px; font-size: 0.8rem; color: #0F6E56; }
  .btn-copy { font-size: 0.75rem; font-weight: 700; padding: 5px 12px; border-radius: 8px; border: 1.5px solid #43C59E; background: transparent; color: #0F6E56; cursor: pointer; margin-top: 6px; }
</style>

<script>
  let corSelecionada = "#6C63FF";
  let linhaCopia = "";

  function abrirModal() {
    document.getElementById("overlay").classList.add("open");
    document.getElementById("success-box").classList.remove("show");
    document.getElementById("f-nome").value = "";
    document.getElementById("f-iniciais").value = "";
    document.getElementById("f-desde").value = "";
    document.getElementById("f-dia").value = "";
  }
  function fecharModal() { document.getElementById("overlay").classList.remove("open"); }
  function fecharSeOverlay(e) { if (e.target.id === "overlay") fecharModal(); }

  function selecionarCor(el) {
    document.querySelectorAll(".color-opt").forEach(o => o.classList.remove("selected"));
    el.classList.add("selected");
    corSelecionada = el.dataset.cor;
  }

  function nomePasta(nome) {
    return nome.toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9\s-]/g, "")
      .trim().replace(/\s+/g, "-");
  }

  function gerarAluna() {
    const nome    = document.getElementById("f-nome").value.trim();
    const iniciais= document.getElementById("f-iniciais").value.trim().toUpperCase();
    const nivel   = document.getElementById("f-nivel").value;
    const dia     = document.getElementById("f-dia").value.trim();
    const desde   = document.getElementById("f-desde").value.trim();

    if (!nome || !iniciais || !dia || !desde) {
      alert("Preencha todos os campos antes de gerar.");
      return;
    }

    const pasta = nomePasta(nome);

    // Salva no painel automaticamente
    const novaAluna = { nome, iniciais, nivel, dia, desde, cor: corSelecionada, pasta };
    const salvas = JSON.parse(localStorage.getItem("alunas_extras") || "[]");
    if (!salvas.find(a => a.pasta === pasta)) {
      salvas.push(novaAluna);
      localStorage.setItem("alunas_extras", JSON.stringify(salvas));
    }
    todasAlunas = [...ALUNAS, ...salvas];
    document.getElementById("count-label").textContent = todasAlunas.length + " aluna" + (todasAlunas.length !== 1 ? "s" : "");
    render(todasAlunas);

      <div class="field-row">
        <div class="field"><label>Status</label>
          <select id="p-status"><option value="novo">Novo</option><option value="andamento">Em andamento</option><option value="concluido">Concluído</option></select>
        </div>
        <div class="field"><label>Link do arquivo</label>
          <div class="link-row"><input id="p-link" placeholder="planos/julho-2025.html"><label class="btn-file" for="p-file" title="Selecionar arquivo">📁</label><input type="file" id="p-file" style="display:none" onchange="selecionarArquivo('p-link','planos/',this)"></div>
        </div>
      </div>
      <button class="btn-add" onclick="adicionarPlano()">+ Adicionar plano</button>
    </div>
    <div class="tab-content" id="tab-aulas">
      <div class="item-list-edit" id="list-aulas"></div>
      <div class="divider"></div>
      <div class="field"><label>Tema da aula</label><input id="a-tema" placeholder="Ex: Present Perfect"></div>
      <div class="field-row">
        <div class="field"><label>Data da aula</label><input id="a-data" placeholder="10/07/2025"></div>
        <div class="field"><label>Tipo</label>
          <select id="a-tipo"><option value="pdf">PDF</option><option value="slides">Slides</option><option value="exercicio">Exercício</option><option value="link">Link</option></select>
        </div>
      </div>
      <div class="field"><label>Link do arquivo</label>
        <div class="link-row"><input id="a-link" placeholder="aulas/aula-10jul2025.pdf"><label class="btn-file" for="a-file" title="Selecionar arquivo">📁</label><input type="file" id="a-file" style="display:none" onchange="selecionarArquivo('a-link','aulas/',this)"></div>
      </div>
      <button class="btn-add" onclick="adicionarAula()">+ Adicionar aula</button>
    </div>
    <div class="tab-content" id="tab-materiais">
      <div class="item-list-edit" id="list-materiais"></div>
      <div class="divider"></div>
      <div class="field"><label>Nome do material</label><input id="m-nome" placeholder="Ex: Lista de vocabulário"></div>
      <div class="field-row">
        <div class="field"><label>Tipo</label>
          <select id="m-tipo"><option value="pdf">PDF</option><option value="audio">Áudio</option><option value="exercicio">Exercício</option><option value="link">Link</option></select>
        </div>
        <div class="field"><label>Data de envio</label><input id="m-data" placeholder="10/07/2025"></div>
      </div>
      <div class="field"><label>Link do arquivo</label>
        <div class="link-row"><input id="m-link" placeholder="materiais/vocab.pdf"><label class="btn-file" for="m-file" title="Selecionar arquivo">📁</label><input type="file" id="m-file" style="display:none" onchange="selecionarArquivo('m-link','materiais/',this)"></div>
      </div>
      <button class="btn-add" onclick="adicionarMaterial()">+ Adicionar material</button>
    </div>
    <div class="panel-footer">
      <button class="btn-cancel-edit" onclick="fecharEditor()">Fechar</button>
      <button class="btn-download" onclick="baixarAtualizado()">⬇️ Baixar HTML atualizado</button>
    </div>
  </div>
</div>

<script>
  const ICONES_TIPO = { pdf:"📄", audio:"🎧", exercicio:"📝", link:"🔗", slides:"📊" };

  function renderPortal() {
    document.getElementById("avatar").textContent     = ALUNO.iniciais;
    document.getElementById("nome-aluno").textContent = ALUNO.nome;
    document.getElementById("subtitulo").textContent  = "Portal de Estudos · " + ALUNO.nivel;
    document.getElementById("tag-desde").textContent  = "Desde " + ALUNO.desde;
    document.getElementById("tag-nivel").textContent  = ALUNO.nivel;
    document.getElementById("tag-aula").textContent   = "Aulas · " + ALUNO.dia_hora;
    document.title = "Portal · " + ALUNO.nome;
    const listaPl = document.getElementById("lista-planos");
    listaPl.innerHTML = PLANOS.length === 0 ? '<p class="empty">Nenhum plano adicionado ainda.</p>' : "";
    PLANOS.forEach(p => { const bc = p.status==="novo"?"badge-new":"badge-done", bl = p.status==="novo"?"Novo":p.status==="andamento"?"Em andamento":"Concluído"; listaPl.innerHTML += \`<a class="item" href="\${p.link}"><div class="item-icon">📅</div><div class="item-info"><p class="item-name">\${p.mes}</p><p class="item-sub">Enviado em \${p.data_envio} · \${p.semanas} semanas</p></div><span class="badge \${bc}">\${bl}</span><span class="arrow">›</span></a>\`; });
    const listaAulas = document.getElementById("lista-aulas");
    listaAulas.innerHTML = AULAS_AO_VIVO.length === 0 ? '<p class="empty">Nenhuma aula registrada ainda.</p>' : "";
    AULAS_AO_VIVO.forEach(a => { listaAulas.innerHTML += \`<a class="item" href="\${a.link}" target="_blank" rel="noopener"><div class="item-icon yellow">\${ICONES_TIPO[a.tipo]||"🎥"}</div><div class="item-info"><p class="item-name">\${a.tema}</p><p class="item-sub">Aula em \${a.data} · \${a.tipo.toUpperCase()}</p></div><span class="arrow">›</span></a>\`; });
    const listaMat = document.getElementById("lista-materiais");
    listaMat.innerHTML = MATERIAIS.length === 0 ? '<p class="empty">Nenhum material adicionado ainda.</p>' : "";
    MATERIAIS.forEach(m => { listaMat.innerHTML += \`<a class="item" href="\${m.link}" target="_blank" rel="noopener"><div class="item-icon green">\${ICONES_TIPO[m.tipo]||"📎"}</div><div class="item-info"><p class="item-name">\${m.nome}</p><p class="item-sub">\${m.tipo.toUpperCase()} · Enviado em \${m.enviado}</p></div><span class="arrow">›</span></a>\`; });
    document.getElementById("footer").textContent = "Atualizado em " + new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
  }

  function renderListas() {
    document.getElementById("list-planos").innerHTML = PLANOS.map((p,i) =>
      \`<div class="item-edit"><span>📅 \${p.mes} · \${p.status}</span><button class="btn-del" onclick="remover('planos',\${i})">✕</button></div>\`).join("") || '<p style="color:var(--muted);font-size:0.8rem">Nenhum plano ainda.</p>';
    document.getElementById("list-aulas").innerHTML = AULAS_AO_VIVO.map((a,i) =>
      \`<div class="item-edit"><span>🎥 \${a.data} · \${a.tema}</span><button class="btn-del" onclick="remover('aulas',\${i})">✕</button></div>\`).join("") || '<p style="color:var(--muted);font-size:0.8rem">Nenhuma aula ainda.</p>';
    document.getElementById("list-materiais").innerHTML = MATERIAIS.map((m,i) =>
      \`<div class="item-edit"><span>📎 \${m.nome}</span><button class="btn-del" onclick="remover('materiais',\${i})">✕</button></div>\`).join("") || '<p style="color:var(--muted);font-size:0.8rem">Nenhum material ainda.</p>';
  }

  function remover(tipo, i) {
    if (tipo==="planos") PLANOS.splice(i,1);
    else if (tipo==="aulas") AULAS_AO_VIVO.splice(i,1);
    else MATERIAIS.splice(i,1);
    renderListas(); renderPortal();
  }

  function adicionarPlano() {
    const mes = document.getElementById("p-mes").value.trim();
    const data = document.getElementById("p-data").value.trim();
    const link = document.getElementById("p-link").value.trim();
    if (!mes || !data || !link) { alert("Preencha todos os campos."); return; }
    PLANOS.unshift({ mes, data_envio: data, semanas: parseInt(document.getElementById("p-semanas").value)||4, status: document.getElementById("p-status").value, link });
    document.getElementById("p-mes").value = "";
    document.getElementById("p-data").value = "";
    document.getElementById("p-link").value = "";
    renderListas(); renderPortal();
  }

  function adicionarAula() {
    const tema = document.getElementById("a-tema").value.trim();
    const data = document.getElementById("a-data").value.trim();
    const link = document.getElementById("a-link").value.trim();
    if (!tema || !data || !link) { alert("Preencha todos os campos."); return; }
    AULAS_AO_VIVO.unshift({ data, tema, tipo: document.getElementById("a-tipo").value, link });
    document.getElementById("a-tema").value = "";
    document.getElementById("a-data").value = "";
    document.getElementById("a-link").value = "";
    renderListas(); renderPortal();
  }

  function adicionarMaterial() {
    const nome = document.getElementById("m-nome").value.trim();
    const data = document.getElementById("m-data").value.trim();
    const link = document.getElementById("m-link").value.trim();
    if (!nome || !data || !link) { alert("Preencha todos os campos."); return; }
    MATERIAIS.unshift({ nome, tipo: document.getElementById("m-tipo").value, enviado: data, link });
    document.getElementById("m-nome").value = "";
    document.getElementById("m-data").value = "";
    document.getElementById("m-link").value = "";
    renderListas(); renderPortal();
  }

  function mudarTab(id, btn) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-"+id).classList.add("active");
  }

  function selecionarArquivo(inputId, pasta, fileInput) {
    if (fileInput.files[0]) {
      document.getElementById(inputId).value = pasta + fileInput.files[0].name;
    }
  }

  function abrirEditor() {
    document.getElementById("edit-nome").textContent = ALUNO.nome;
    renderListas();
    document.getElementById("edit-overlay").classList.add("open");
  }
  function fecharEditor() { document.getElementById("edit-overlay").classList.remove("open"); }
  function fecharSeOverlay(e) { if (e.target.id==="edit-overlay") fecharEditor(); }

  function baixarAtualizado() {
    const planosJSON    = JSON.stringify(PLANOS, null, 4);
    const aulasJSON     = JSON.stringify(AULAS_AO_VIVO, null, 4);
    const materiaisJSON = JSON.stringify(MATERIAIS, null, 4);
    const html = document.documentElement.outerHTML
      .replace(/let PLANOS = \\[[\\s\\S]*?\\];/, "let PLANOS = " + planosJSON + ";")
      .replace(/let AULAS_AO_VIVO = \\[[\\s\\S]*?\\];/, "let AULAS_AO_VIVO = " + aulasJSON + ";")
      .replace(/let MATERIAIS = \\[[\\s\\S]*?\\];/, "let MATERIAIS = " + materiaisJSON + ";");
    const blob = new Blob([html], { type: "text/html" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "index.html"; a.click(); URL.revokeObjectURL(a.href);
  }

  renderPortal();
<\/script>
</body>
</html>`;

    // Baixar o arquivo com nome da aluna
    const blob = new Blob([html], { type: "text/html" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url;
    a.download = "index.html";
    a.click();
    URL.revokeObjectURL(url);

    // Mostrar instrução
    linhaCopia = `    {\n      nome:    "${nome}",\n      iniciais:"${iniciais}",\n      nivel:   "${nivel}",\n      dia:     "${dia}",\n      desde:   "${desde}",\n      cor:     "${corSelecionada}",\n      pasta:   "${pasta}"\n    },`;

    const link = `https://borbulhaingles-jpg.github.io/Planos-dos-alunos/alunos/${pasta}/`;
    const uploadUrl = `https://github.com/borbulhaingles-jpg/Planos-dos-alunos/upload/main/alunos/${pasta}`;
    linhaCopia = link;

    document.getElementById("success-msg").innerHTML =
      `✅ Arquivo <strong>${pasta}.html</strong> baixado!<br><br>
       <strong>Para subir no GitHub (2 passos):</strong><br>
       1. <a href="${uploadUrl}" target="_blank" style="color:#0F6E56;font-weight:700">Clique aqui → abre a pasta certa no GitHub</a><br>
       2. Arraste o arquivo <code>${pasta}.html</code> da sua pasta Downloads e clique <strong>Commit changes</strong><br><br>
       <strong>Link para mandar para a aluna:</strong><br>
       <code>${link}</code>`;
    document.getElementById("success-box").classList.add("show");
  }

  function copiarLinha() {
    navigator.clipboard.writeText(linhaCopia).then(() => {
      document.querySelector(".btn-copy").textContent = "✅ Copiado!";
      setTimeout(() => document.querySelector(".btn-copy").textContent = "📋 Copiar linha para o painel", 2000);
    });
  }

  // Render
  function render(lista) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    lista.forEach(a => {
      grid.innerHTML += `
        <a class="aluna-card" href="${a.pasta}/index.html">
          <div class="card-top">
            <div class="avatar" style="background:${a.cor}">${a.iniciais}</div>
            <div><p class="card-name">${a.nome}</p><p class="card-nivel">${a.nivel}</p></div>
          </div>
          <div class="card-tags"><span class="tag tag-y">📅 ${a.dia}</span></div>
          <div class="card-footer">
            <span class="card-since">Desde ${a.desde}</span>
            <span class="arrow">Abrir →</span>
          </div>
        </a>`;
    });
  }

  function filtrar() {
    const q = document.getElementById("busca").value.toLowerCase();
    const f = todasAlunas.filter(a => a.nome.toLowerCase().includes(q) || a.nivel.toLowerCase().includes(q));
    render(f);
    document.getElementById("vazio").style.display = f.length === 0 ? "block" : "none";
  }

  const extras = JSON.parse(localStorage.getItem("alunas_extras") || "[]");
  let todasAlunas = [...ALUNAS, ...extras];
  document.getElementById("count-label").textContent = todasAlunas.length + " aluna" + (todasAlunas.length !== 1 ? "s" : "");
  document.getElementById("footer").textContent = "Atualizado em " + new Date().toLocaleDateString("pt-BR", { day:"2-digit", month:"long", year:"numeric" });
  render(todasAlunas);
</script>
</body>
</html>
