<!DOCTYPE html>
<html lang="pt-BR">

<title>Karol English · Painel de Alunas</title>
<style>
  :root {
    --primary: #1A6B4A;
    --primary-light: #E6FAF4;
    --green-light: #E6FAF4;
    --yellow-light: #FFF6E5;
    --yellow-text: #854F0B;
    --bg: #F4F6FB;
    --card: #FFFFFF;
    --text: #1E1E2D;
    --muted: #8F90A6;
    --border: #E8E9F0;
    --shadow: 0 2px 16px rgba(26,107,74,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .top-bar {
    background: var(--primary);
    padding: 24px 28px;
    color: #fff;
    display: flex; align-items: center; gap: 16px;
  }
  .top-logo { font-size: 1.5rem; }
  .top-bar h1 { font-size: 1.2rem; font-weight: 700; }
  .top-bar p  { font-size: 0.8rem; opacity: 0.8; margin-top: 3px; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .top-count { background: rgba(255,255,255,0.18); font-size: 0.78rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; white-space: nowrap; }
  .btn-nova {
    background: #fff; color: var(--primary);
    font-size: 0.82rem; font-weight: 700;
    padding: 8px 16px; border-radius: 20px;
    border: none; cursor: pointer; white-space: nowrap;
    transition: opacity 0.15s;
  }
  .btn-nova:hover { opacity: 0.88; }

  .content { max-width: 820px; margin: 0 auto; padding: 32px 20px 60px; }

  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1.5px solid var(--border);
    border-radius: 12px; padding: 10px 16px;
    margin-bottom: 28px; box-shadow: var(--shadow);
  }
  .search-bar input { border: none; outline: none; font-size: 0.9rem; flex: 1; background: transparent; color: var(--text); }
  .search-bar input::placeholder { color: var(--muted); }

  .section-title {
    font-size: 0.75rem; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }

  .aluna-card {
    background: var(--card); border-radius: 14px; border: 1.5px solid var(--border);
    padding: 18px; text-decoration: none; color: var(--text);
    display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s;
    box-shadow: var(--shadow);
  }
  .aluna-card:hover { border-color: var(--primary); box-shadow: 0 4px 20px rgba(26,107,74,0.15); transform: translateY(-2px); }

  .card-top { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; flex-shrink: 0; color: #fff; }
  .card-name { font-size: 0.95rem; font-weight: 700; }
  .card-nivel { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 0.68rem; font-weight: 600; padding: 3px 9px; border-radius: 10px; }
  .tag-y { background: var(--yellow-light); color: var(--yellow-text); }
  .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--border); }
  .card-since { font-size: 0.72rem; color: var(--muted); }
  .arrow { color: var(--primary); font-size: 1rem; font-weight: 600; }
  .empty-search { text-align: center; color: var(--muted); font-size: 0.88rem; padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: 0.72rem; margin-top: 40px; }

  /* ── MODAL ── */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 100;
    align-items: center; justify-content: center;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--card); border-radius: 18px;
    padding: 28px; width: 100%; max-width: 460px; margin: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }
  .modal h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .field input, .field select {
    width: 100%; padding: 10px 14px; border-radius: 10px;
    border: 1.5px solid var(--border); font-size: 0.9rem;
    color: var(--text); background: var(--bg); outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus { border-color: var(--primary); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .color-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .color-opt { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: transform 0.15s; }
  .color-opt:hover { transform: scale(1.15); }
  .color-opt.selected { border-color: var(--text); }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn-cancel { flex: 1; padding: 11px; border-radius: 10px; border: 1.5px solid var(--border); background: transparent; font-size: 0.9rem; cursor: pointer; color: var(--muted); }
  .btn-gerar { flex: 2; padding: 11px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
  .btn-gerar:hover { opacity: 0.88; }

  /* ── SUCESSO ── */
  .success-box { display: none; background: #E6FAF4; border: 1.5px solid #43C59E; border-radius: 12px; padding: 16px 18px; margin-top: 18px; }
  .success-box.show { display: block; }
  .success-box p { font-size: 0.85rem; color: #0F6E56; line-height: 1.6; margin-bottom: 8px; }
  .success-box code { background: #fff; border-radius: 6px; padding: 2px 6px; font-size: 0.8rem; color: #0F6E56; }
  .btn-copy { font-size: 0.75rem; font-weight: 700; padding: 5px 12px; border-radius: 8px; border: 1.5px solid #43C59E; background: transparent; color: #0F6E56; cursor: pointer; margin-top: 6px; }
</style>
</head>

  }

    return nome.toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9\s-]/g, "")
      .trim().replace(/\s+/g, "-");
  }

       2. Arraste o arquivo <code>${pasta}.html</code> da sua pasta Downloads e clique <strong>Commit changes</strong><br><br>
       <strong>Link para mandar para a aluna:</strong><br>
       <code>${link}</code>`;
    document.getElementById("success-box").classList.add("show");
  }

  function copiarLinha() {
    navigator.clipboard.writeText(linhaCopia).then(() => {
      document.querySelector(".btn-copy").textContent = "✅ Copiado!";
      setTimeout(() => document.querySelector(".btn-copy").textContent = "📋 Copiar linha para o painel", 2000);
    });
  }

  // Render
  function render(lista) {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    lista.forEach(a => {
      grid.innerHTML += `
        <a class="aluna-card" href="${a.pasta}/index.html">
          <div class="card-top">
            <div class="avatar" style="background:${a.cor}">${a.iniciais}</div>
            <div><p class="card-name">${a.nome}</p><p class="card-nivel">${a.nivel}</p></div>
          </div>
          <div class="card-tags"><span class="tag tag-y">📅 ${a.dia}</span></div>
          <div class="card-footer">
            <span class="card-since">Desde ${a.desde}</span>
            <span class="arrow">Abrir →</span>
          </div>
        </a>`;
    });
  }

  function filtrar() {
    const q = document.getElementById("busca").value.toLowerCase();
    const f = todasAlunas.filter(a => a.nome.toLowerCase().includes(q) || a.nivel.toLowerCase().includes(q));
    render(f);
    document.getElementById("vazio").style.display = f.length === 0 ? "block" : "none";
  }

  const extras = JSON.parse(localStorage.getItem("alunas_extras") || "[]");
  let todasAlunas = [...ALUNAS, ...extras];
  document.getElementById("count-label").textContent = todasAlunas.length + " aluna" + (todasAlunas.length !== 1 ? "s" : "");
  document.getElementById("footer").textContent = "Atualizado em " + new Date().toLocaleDateString("pt-BR", { day:"2-digit", month:"long", year:"numeric" });
  render(todasAlunas);
</script>
</body>
</html>
