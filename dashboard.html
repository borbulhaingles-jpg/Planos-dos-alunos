<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Alunos</title>
<style>
  :root {
    --primary: #6C63FF;
    --primary-light: #EEF0FF;
    --accent: #FF6584;
    --green: #43C59E;
    --yellow: #FFB830;
    --bg: #F4F6FB;
    --card: #FFFFFF;
    --text: #1E1E2D;
    --muted: #8F90A6;
    --border: #E8E9F0;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(108,99,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── LAYOUT ── */
  #app { display: flex; min-height: 100vh; }

  aside {
    width: 260px;
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .logo {
    padding: 0 20px 20px;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .logo span { font-size: 1.5rem; }

  .sidebar-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 0 20px 8px;
  }

  #student-list { list-style: none; flex: 1; }

  #student-list li {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.92rem;
    transition: all 0.15s;
    color: var(--text);
  }

  #student-list li:hover { background: var(--primary-light); }

  #student-list li.active {
    background: var(--primary-light);
    border-left-color: var(--primary);
    color: var(--primary);
    font-weight: 600;
  }

  .avatar-sm {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  .btn-add-student {
    margin: 16px;
    padding: 10px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity 0.15s;
  }

  .btn-add-student:hover { opacity: 0.88; }

  main {
    flex: 1;
    padding: 32px;
    overflow-y: auto;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    text-align: center;
    gap: 12px;
    color: var(--muted);
  }

  .empty-state .big-icon { font-size: 4rem; }
  .empty-state h2 { color: var(--text); font-size: 1.3rem; }
  .empty-state p { font-size: 0.9rem; max-width: 300px; line-height: 1.5; }

  /* ── STUDENT HEADER ── */
  .student-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .avatar-lg {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 700;
    flex-shrink: 0;
  }

  .student-meta h1 { font-size: 1.4rem; font-weight: 700; }
  .student-meta .tags { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

  .tag {
    background: var(--primary-light);
    color: var(--primary);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }

  .tag.green { background: #E6FAF4; color: var(--green); }
  .tag.yellow { background: #FFF6E5; color: #c98a00; }

  .header-actions { margin-left: auto; display: flex; gap: 8px; }

  /* ── GRID ── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 24px; }

  @media (max-width: 900px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    aside { width: 220px; }
    main { padding: 20px; }
  }

  /* ── CARDS ── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }

  .card-title {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* ── STAT CARDS ── */
  .stat-value { font-size: 2rem; font-weight: 800; color: var(--text); line-height: 1; }
  .stat-label { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }

  /* ── COMPETENCY BARS ── */
  .competency-list { display: flex; flex-direction: column; gap: 12px; }

  .comp-row { display: flex; flex-direction: column; gap: 4px; }

  .comp-header { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .comp-name { font-weight: 600; }
  .comp-score { color: var(--muted); font-size: 0.8rem; }

  .bar-track {
    height: 8px;
    background: var(--bg);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--primary);
    transition: width 0.6s ease;
  }

  .bar-fill.speaking { background: #6C63FF; }
  .bar-fill.listening { background: #43C59E; }
  .bar-fill.grammar { background: #FFB830; }
  .bar-fill.reading { background: #FF6584; }
  .bar-fill.writing { background: #4EAFF0; }

  /* ── ACTIVITIES ── */
  .activity-list { display: flex; flex-direction: column; gap: 10px; }

  .activity-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: 10px;
    border-left: 4px solid var(--primary);
    position: relative;
  }

  .activity-item.done { border-left-color: var(--green); opacity: 0.75; }

  .activity-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 2px; }

  .activity-body { flex: 1; }
  .activity-title { font-size: 0.9rem; font-weight: 600; }
  .activity-meta { font-size: 0.78rem; color: var(--muted); margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; }

  .activity-actions { display: flex; gap: 6px; }

  .btn-icon {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    padding: 2px 4px;
    border-radius: 6px;
    color: var(--muted);
    transition: color 0.15s, background 0.15s;
  }

  .btn-icon:hover { color: var(--primary); background: var(--primary-light); }
  .btn-icon.danger:hover { color: var(--accent); background: #FFF0F3; }

  /* ── PLANO DE ESTUDOS ── */
  .plano-list { display: flex; flex-direction: column; gap: 8px; }

  .plano-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 10px;
    font-size: 0.88rem;
  }

  .plano-check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
    font-size: 0.7rem;
  }

  .plano-check.checked { background: var(--green); border-color: var(--green); color: #fff; }

  .plano-text { flex: 1; }
  .plano-text.done { text-decoration: line-through; color: var(--muted); }

  .plano-date { font-size: 0.75rem; color: var(--muted); }

  /* ── NOTES ── */
  .notes-area {
    width: 100%;
    min-height: 90px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.88rem;
    color: var(--text);
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }

  .notes-area:focus { border-color: var(--primary); }

  /* ── BUTTONS ── */
  .btn {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn-outline:hover { background: var(--primary-light); }
  .btn-danger { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-danger:hover { background: #FFF0F3; }
  .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

  /* ── MODALS ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(2px);
  }

  .modal {
    background: var(--card);
    border-radius: 18px;
    padding: 28px;
    width: 480px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }

  .modal h2 { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; }

  .form-group { margin-bottom: 16px; }

  label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }

  input[type=text], input[type=date], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--primary); background: #fff; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── RANGE SLIDER ── */
  .comp-sliders { display: flex; flex-direction: column; gap: 14px; }

  .slider-row { display: flex; flex-direction: column; gap: 4px; }
  .slider-header { display: flex; justify-content: space-between; font-size: 0.85rem; }
  .slider-name { font-weight: 600; }
  .slider-val { color: var(--primary); font-weight: 700; }

  input[type=range] {
    width: 100%;
    accent-color: var(--primary);
    height: 6px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
  }

  /* ── SECTION DIVIDER ── */
  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 28px 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── TIMELINE ── */
  .timeline { display: flex; flex-direction: column; gap: 0; }

  .tl-item {
    display: flex;
    gap: 14px;
    padding-bottom: 16px;
    position: relative;
  }

  .tl-item::before {
    content: '';
    position: absolute;
    left: 15px;
    top: 28px;
    bottom: 0;
    width: 2px;
    background: var(--border);
  }

  .tl-item:last-child::before { display: none; }

  .tl-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--primary-light);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 0.9rem;
    z-index: 1;
  }

  .tl-content { flex: 1; }
  .tl-title { font-size: 0.9rem; font-weight: 600; }
  .tl-date { font-size: 0.77rem; color: var(--muted); margin-bottom: 4px; }
  .tl-notes { font-size: 0.83rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-top: 6px; line-height: 1.5; }

  /* ── NO ITEMS ── */
  .no-items {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.88rem;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <aside>
    <div class="logo"><span>📚</span> Meus Alunos</div>
    <div class="sidebar-label">Alunos</div>
    <ul id="student-list"></ul>
    <button class="btn-add-student" onclick="openModal('modal-add-student')">+ Novo Aluno</button>
  </aside>

  <!-- MAIN -->
  <main id="main-content">
    <div class="empty-state" id="empty-state">
      <div class="big-icon">🎓</div>
      <h2>Nenhum aluno selecionado</h2>
      <p>Adicione um aluno pela barra lateral ou selecione um para ver o dashboard completo.</p>
    </div>
    <div id="student-view" class="hidden"></div>
  </main>
</div>

<!-- ── MODAL: NOVO ALUNO ── -->
<div class="overlay hidden" id="modal-add-student">
  <div class="modal">
    <h2>✨ Novo Aluno</h2>
    <div class="form-group">
      <label>Nome completo</label>
      <input type="text" id="s-name" placeholder="Ex: Ana Clara Silva">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Nível atual</label>
        <select id="s-level">
          <option>A1 – Iniciante</option>
          <option>A2 – Básico</option>
          <option>B1 – Intermediário</option>
          <option>B2 – Intermediário avançado</option>
          <option>C1 – Avançado</option>
          <option>C2 – Proficiente</option>
        </select>
      </div>
      <div class="form-group">
        <label>Meta de nível</label>
        <select id="s-goal-level">
          <option>A2 – Básico</option>
          <option>B1 – Intermediário</option>
          <option>B2 – Intermediário avançado</option>
          <option>C1 – Avançado</option>
          <option>C2 – Proficiente</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Objetivo principal</label>
      <input type="text" id="s-objective" placeholder="Ex: Falar inglês para viagem, business english, IELTS…">
    </div>
    <div class="form-group">
      <label>Frequência de aulas</label>
      <input type="text" id="s-frequency" placeholder="Ex: 2x por semana, toda terça e quinta">
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-add-student')">Cancelar</button>
      <button class="btn btn-primary" onclick="addStudent()">Salvar aluno</button>
    </div>
  </div>
</div>

<!-- ── MODAL: NOVA ATIVIDADE (PLANO PÓS-AULA) ── -->
<div class="overlay hidden" id="modal-add-activity">
  <div class="modal">
    <h2>📋 Adicionar Atividade do Plano</h2>
    <div class="form-group">
      <label>Atividade / Tarefa</label>
      <input type="text" id="a-title" placeholder="Ex: Escutar podcast 15min, revisar Unit 3, redação sobre…">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Tipo</label>
        <select id="a-type">
          <option value="📖">📖 Leitura</option>
          <option value="🎧">🎧 Listening</option>
          <option value="✍️">✍️ Escrita</option>
          <option value="🗣️">🗣️ Speaking</option>
          <option value="📝">📝 Gramática</option>
          <option value="🎬">🎬 Vídeo/Série</option>
          <option value="🔤">🔤 Vocabulário</option>
          <option value="📱">📱 App/Online</option>
          <option value="🎯">🎯 Exercício</option>
        </select>
      </div>
      <div class="form-group">
        <label>Prazo (opcional)</label>
        <input type="date" id="a-deadline">
      </div>
    </div>
    <div class="form-group">
      <label>Observações</label>
      <textarea id="a-notes" rows="3" placeholder="Detalhes, links, instruções…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-add-activity')">Cancelar</button>
      <button class="btn btn-primary" onclick="addActivity()">Adicionar</button>
    </div>
  </div>
</div>

<!-- ── MODAL: REGISTRAR AULA ── -->
<div class="overlay hidden" id="modal-add-lesson">
  <div class="modal">
    <h2>🎓 Registrar Aula</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Data da aula</label>
        <input type="date" id="l-date">
      </div>
      <div class="form-group">
        <label>Tema / Tópico</label>
        <input type="text" id="l-topic" placeholder="Ex: Past perfect, travel vocabulary…">
      </div>
    </div>
    <div class="form-group">
      <label>Observações da aula</label>
      <textarea id="l-notes" rows="3" placeholder="Dificuldades, pontos fortes, o que ficou para revisar…"></textarea>
    </div>
    <div class="form-group">
      <label>Avaliação de competências (essa aula)</label>
      <div class="comp-sliders" id="lesson-comp-sliders"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-add-lesson')">Cancelar</button>
      <button class="btn btn-primary" onclick="addLesson()">Registrar aula</button>
    </div>
  </div>
</div>

<!-- ── MODAL: EDITAR ALUNO ── -->
<div class="overlay hidden" id="modal-edit-student">
  <div class="modal">
    <h2>✏️ Editar Aluno</h2>
    <div class="form-group">
      <label>Nome completo</label>
      <input type="text" id="es-name">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Nível atual</label>
        <select id="es-level">
          <option>A1 – Iniciante</option>
          <option>A2 – Básico</option>
          <option>B1 – Intermediário</option>
          <option>B2 – Intermediário avançado</option>
          <option>C1 – Avançado</option>
          <option>C2 – Proficiente</option>
        </select>
      </div>
      <div class="form-group">
        <label>Meta de nível</label>
        <select id="es-goal-level">
          <option>A2 – Básico</option>
          <option>B1 – Intermediário</option>
          <option>B2 – Intermediário avançado</option>
          <option>C1 – Avançado</option>
          <option>C2 – Proficiente</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Objetivo principal</label>
      <input type="text" id="es-objective">
    </div>
    <div class="form-group">
      <label>Frequência de aulas</label>
      <input type="text" id="es-frequency">
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="deleteStudent()">🗑 Excluir aluno</button>
      <button class="btn btn-outline" onclick="closeModal('modal-edit-student')">Cancelar</button>
      <button class="btn btn-primary" onclick="saveEditStudent()">Salvar</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──
const COMPETENCIES = ['Speaking','Listening','Grammar','Reading','Writing'];
const COMP_CLASS   = ['speaking','listening','grammar','reading','writing'];

function getData() {
  return JSON.parse(localStorage.getItem('dashboard_v2') || '{"students":[]}');
}
function saveData(d) {
  localStorage.setItem('dashboard_v2', JSON.stringify(d));
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

function initials(name) {
  return name.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
}

function formatDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

// ── STATE ──
let currentStudentId = null;

// ── SIDEBAR ──
function renderSidebar() {
  const { students } = getData();
  const ul = document.getElementById('student-list');
  ul.innerHTML = '';
  if (students.length === 0) {
    ul.innerHTML = '<li style="color:var(--muted);font-size:0.82rem;padding:10px 20px">Nenhum aluno ainda</li>';
    return;
  }
  students.forEach(s => {
    const li = document.createElement('li');
    li.className = s.id === currentStudentId ? 'active' : '';
    li.innerHTML = `<div class="avatar-sm">${initials(s.name)}</div>${s.name}`;
    li.onclick = () => selectStudent(s.id);
    ul.appendChild(li);
  });
}

function selectStudent(id) {
  currentStudentId = id;
  renderSidebar();
  renderStudentView();
}

// ── STUDENT VIEW ──
function renderStudentView() {
  const { students } = getData();
  const s = students.find(x => x.id === currentStudentId);
  document.getElementById('empty-state').classList.add('hidden');
  const view = document.getElementById('student-view');
  view.classList.remove('hidden');

  if (!s) { view.innerHTML = ''; return; }

  // Compute stats
  const totalLessons = s.lessons.length;
  const totalActivities = s.activities.length;
  const doneActivities = s.activities.filter(a => a.done).length;
  const pendingActivities = totalActivities - doneActivities;

  // Avg competencies across all lessons
  const avgComp = {};
  COMPETENCIES.forEach(c => { avgComp[c] = 0; });
  if (s.lessons.length > 0) {
    s.lessons.forEach(l => {
      COMPETENCIES.forEach(c => { avgComp[c] += (l.comp?.[c] || 0); });
    });
    COMPETENCIES.forEach(c => { avgComp[c] = Math.round(avgComp[c] / s.lessons.length); });
  }

  view.innerHTML = `
    <!-- Header -->
    <div class="student-header">
      <div class="avatar-lg">${initials(s.name)}</div>
      <div class="student-meta">
        <h1>${s.name}</h1>
        <div class="tags">
          <span class="tag">${s.level}</span>
          ${s.goalLevel ? `<span class="tag yellow">Meta: ${s.goalLevel}</span>` : ''}
          ${s.objective ? `<span class="tag green">${s.objective}</span>` : ''}
          ${s.frequency ? `<span class="tag">${s.frequency}</span>` : ''}
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-outline btn-sm" onclick="openEditStudent()">✏️ Editar</button>
        <button class="btn btn-primary btn-sm" onclick="openModal('modal-add-lesson')">+ Registrar Aula</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid-3">
      <div class="card">
        <div class="card-title">Aulas dadas</div>
        <div class="stat-value">${totalLessons}</div>
        <div class="stat-label">aulas registradas</div>
      </div>
      <div class="card">
        <div class="card-title">Plano de estudos</div>
        <div class="stat-value">${doneActivities}<span style="font-size:1rem;color:var(--muted)">/${totalActivities}</span></div>
        <div class="stat-label">atividades concluídas</div>
      </div>
      <div class="card">
        <div class="card-title">Pendentes</div>
        <div class="stat-value" style="color:${pendingActivities>0?'var(--accent)':'var(--green)'}">${pendingActivities}</div>
        <div class="stat-label">atividades em aberto</div>
      </div>
    </div>

    <!-- Competências + Plano -->
    <div class="grid-2">
      <!-- Competências -->
      <div class="card">
        <div class="card-title">Progresso por competência <span style="font-size:0.7rem;color:var(--muted)">(média das aulas)</span></div>
        ${s.lessons.length === 0 ? '<div class="no-items">Registre aulas para ver o progresso 📈</div>' : `
        <div class="competency-list">
          ${COMPETENCIES.map((c,i) => `
            <div class="comp-row">
              <div class="comp-header">
                <span class="comp-name">${c}</span>
                <span class="comp-score">${avgComp[c]}%</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill ${COMP_CLASS[i]}" style="width:${avgComp[c]}%"></div>
              </div>
            </div>
          `).join('')}
        </div>`}
      </div>

      <!-- Plano de estudos -->
      <div class="card">
        <div class="card-title">
          Plano de estudos
          <button class="btn btn-primary btn-sm" onclick="openModal('modal-add-activity')">+ Adicionar</button>
        </div>
        ${s.activities.length === 0
          ? '<div class="no-items">Nenhuma atividade ainda. Adicione após a aula! 📋</div>'
          : `<div class="plano-list">${s.activities.slice().reverse().slice(0,8).map(a => `
            <div class="plano-item">
              <div class="plano-check ${a.done ? 'checked' : ''}" onclick="toggleActivity('${a.id}')">${a.done ? '✓' : ''}</div>
              <div class="plano-text ${a.done ? 'done' : ''}">
                ${a.type} ${a.title}
                ${a.deadline ? `<div class="plano-date">⏰ Até ${formatDate(a.deadline)}</div>` : ''}
              </div>
              <button class="btn-icon danger" onclick="deleteActivity('${a.id}')">🗑</button>
            </div>
          `).join('')}</div>
          ${s.activities.length > 8 ? `<div style="text-align:center;margin-top:10px"><button class="btn btn-outline btn-sm" onclick="showAllActivities()">Ver todas (${s.activities.length})</button></div>` : ''}`
        }
      </div>
    </div>

    <!-- Histórico de aulas -->
    <div class="section-title">Histórico de aulas</div>
    ${s.lessons.length === 0
      ? '<div class="card"><div class="no-items">Nenhuma aula registrada ainda. Clique em "+ Registrar Aula" para começar! 🎓</div></div>'
      : `<div class="card"><div class="timeline">${s.lessons.slice().reverse().map(l => `
          <div class="tl-item">
            <div class="tl-dot">📗</div>
            <div class="tl-content">
              <div class="tl-date">${formatDate(l.date)}</div>
              <div class="tl-title">${l.topic || 'Aula sem título'}</div>
              ${l.comp ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
                ${COMPETENCIES.map((c,i) => l.comp[c] > 0 ? `<span class="tag ${['','green','yellow','',''][i]}" style="font-size:0.72rem">${c} ${l.comp[c]}%</span>` : '').join('')}
              </div>` : ''}
              ${l.notes ? `<div class="tl-notes">${l.notes}</div>` : ''}
              <button class="btn-icon danger" style="margin-top:6px" onclick="deleteLesson('${l.id}')">🗑 remover aula</button>
            </div>
          </div>
        `).join('')}</div></div>`
    }
  `;
}

// ── MODALS ──
function openModal(id) {
  document.getElementById(id).classList.remove('hidden');
  if (id === 'modal-add-lesson') {
    document.getElementById('l-date').value = new Date().toISOString().split('T')[0];
    buildLessonSliders();
  }
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

document.querySelectorAll('.overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) el.classList.add('hidden');
  });
});

// ── ADD STUDENT ──
function addStudent() {
  const name = document.getElementById('s-name').value.trim();
  if (!name) { alert('Informe o nome do aluno.'); return; }
  const d = getData();
  const student = {
    id: uid(),
    name,
    level: document.getElementById('s-level').value,
    goalLevel: document.getElementById('s-goal-level').value,
    objective: document.getElementById('s-objective').value.trim(),
    frequency: document.getElementById('s-frequency').value.trim(),
    lessons: [],
    activities: [],
    notes: ''
  };
  d.students.push(student);
  saveData(d);
  closeModal('modal-add-student');
  ['s-name','s-objective','s-frequency'].forEach(id => document.getElementById(id).value = '');
  selectStudent(student.id);
}

// ── EDIT STUDENT ──
function openEditStudent() {
  const { students } = getData();
  const s = students.find(x => x.id === currentStudentId);
  if (!s) return;
  document.getElementById('es-name').value = s.name;
  document.getElementById('es-objective').value = s.objective || '';
  document.getElementById('es-frequency').value = s.frequency || '';
  document.getElementById('es-level').value = s.level;
  document.getElementById('es-goal-level').value = s.goalLevel || 'B1 – Intermediário';
  openModal('modal-edit-student');
}

function saveEditStudent() {
  const d = getData();
  const s = d.students.find(x => x.id === currentStudentId);
  if (!s) return;
  s.name = document.getElementById('es-name').value.trim() || s.name;
  s.level = document.getElementById('es-level').value;
  s.goalLevel = document.getElementById('es-goal-level').value;
  s.objective = document.getElementById('es-objective').value.trim();
  s.frequency = document.getElementById('es-frequency').value.trim();
  saveData(d);
  closeModal('modal-edit-student');
  renderSidebar();
  renderStudentView();
}

function deleteStudent() {
  if (!confirm('Excluir este aluno e todos os dados? Essa ação não pode ser desfeita.')) return;
  const d = getData();
  d.students = d.students.filter(x => x.id !== currentStudentId);
  saveData(d);
  currentStudentId = null;
  closeModal('modal-edit-student');
  renderSidebar();
  document.getElementById('empty-state').classList.remove('hidden');
  document.getElementById('student-view').classList.add('hidden');
}

// ── ADD ACTIVITY ──
function addActivity() {
  const title = document.getElementById('a-title').value.trim();
  if (!title) { alert('Informe a atividade.'); return; }
  const d = getData();
  const s = d.students.find(x => x.id === currentStudentId);
  s.activities.push({
    id: uid(),
    title,
    type: document.getElementById('a-type').value,
    deadline: document.getElementById('a-deadline').value,
    notes: document.getElementById('a-notes').value.trim(),
    done: false,
    createdAt: new Date().toISOString().split('T')[0]
  });
  saveData(d);
  closeModal('modal-add-activity');
  ['a-title','a-notes','a-deadline'].forEach(id => document.getElementById(id).value = '');
  renderStudentView();
}

function toggleActivity(actId) {
  const d = getData();
  const s = d.students.find(x => x.id === currentStudentId);
  const a = s.activities.find(x => x.id === actId);
  if (a) a.done = !a.done;
  saveData(d);
  renderStudentView();
}

function deleteActivity(actId) {
  const d = getData();
  const s = d.students.find(x => x.id === currentStudentId);
  s.activities = s.activities.filter(x => x.id !== actId);
  saveData(d);
  renderStudentView();
}

// ── ADD LESSON ──
function buildLessonSliders() {
  const container = document.getElementById('lesson-comp-sliders');
  container.innerHTML = COMPETENCIES.map((c,i) => `
    <div class="slider-row">
      <div class="slider-header">
        <span class="slider-name">${c}</span>
        <span class="slider-val" id="sv-${c}">70%</span>
      </div>
      <input type="range" min="0" max="100" value="70" id="sr-${c}"
        oninput="document.getElementById('sv-${c}').textContent=this.value+'%'">
    </div>
  `).join('');
}

function addLesson() {
  const d = getData();
  const s = d.students.find(x => x.id === currentStudentId);
  const comp = {};
  COMPETENCIES.forEach(c => { comp[c] = parseInt(document.getElementById('sr-'+c)?.value || 0); });
  s.lessons.push({
    id: uid(),
    date: document.getElementById('l-date').value || new Date().toISOString().split('T')[0],
    topic: document.getElementById('l-topic').value.trim(),
    notes: document.getElementById('l-notes').value.trim(),
    comp
  });
  saveData(d);
  closeModal('modal-add-lesson');
  ['l-topic','l-notes'].forEach(id => document.getElementById(id).value = '');
  renderStudentView();
}

function deleteLesson(lessonId) {
  if (!confirm('Remover esta aula do histórico?')) return;
  const d = getData();
  const s = d.students.find(x => x.id === currentStudentId);
  s.lessons = s.lessons.filter(x => x.id !== lessonId);
  saveData(d);
  renderStudentView();
}

// ── INIT ──
renderSidebar();
</script>
</body>
</html>
